<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="פרקט">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
</head><body>
<title>פרקט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@400;500;700;800;900&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: one phone column. Compact sticky header, content cards, a floating dock at the bottom where the active tab grows into a labelled pill.
   Identity: "courtside at night" — indigo night, coral as the action color (court paint / sneaker), cyan for data, gold only for money and trophies. Single dark look on purpose. */
:root{
  --bg:#0c0b17; --s1:#141327; --s2:#1b1a33; --s3:#25233f; --line:#2a2847; --line2:#3a3760;
  --text:#f2f1fb; --mute:#9d9abb; --dim:#6c6990;
  --coral:#ff6a4d; --coral-d:#e0472b; --cyan:#4cc9f0; --gold:#ffc95c; --good:#45d39a; --bad:#ff5470; --violet:#a78bfa;
  --f:'Rubik','Heebo','Arial Hebrew',system-ui,sans-serif;
  --disp:'Secular One','Rubik',system-ui,sans-serif;
  --num:'Oswald','Chakra Petch',ui-monospace,monospace;
  --cond:'Oswald','Karantina','Secular One',sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
input,select,textarea{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:16px 50%,21px 50%;background-size:5px 5px;background-repeat:no-repeat;padding-left:32px}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
 background-image:radial-gradient(90% 40% at 100% 0%,rgba(255,106,77,.10),rgba(255,106,77,0) 70%),radial-gradient(80% 40% at 0% 10%,rgba(76,201,240,.08),rgba(76,201,240,0) 70%);background-attachment:fixed}
#app{max-width:540px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom,0px))}
#app.bare{padding-bottom:32px}
button{font-family:inherit;color:inherit}
.tn{font-variant-numeric:tabular-nums}.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.dim{color:var(--dim)}.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}.cyan{color:var(--cyan)}.coral{color:var(--coral)}
.lab{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
.h1{font-family:var(--cond);font-size:44px;font-weight:700;line-height:.98;letter-spacing:.3px;margin:0;text-wrap:balance}
.h2{font-family:var(--cond);font-size:30px;font-weight:700;letter-spacing:.2px;margin:0;line-height:1.15;text-wrap:balance}
.h3{font-size:16px;font-weight:800;margin:0}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.card{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card.arc{overflow:hidden}
.card.arc:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;border:1.5px solid rgba(255,255,255,.05);inset-inline-end:-120px;top:-150px;pointer-events:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 2px 10px}
.sec b{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.3px}
.sec span{font-size:12.5px;color:var(--mute)}
.btn{appearance:none;border:0;border-radius:11px;padding:12px 16px;font-weight:800;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:linear-gradient(180deg,#ff8466,var(--coral-d));color:#fff;box-shadow:0 10px 24px -12px rgba(255,106,77,.9)}
.btn.cy{background:linear-gradient(180deg,#6fd6f5,#2aa7d1);color:#04202b}
.btn.gold{background:linear-gradient(180deg,#ffd885,#d9a23a);color:#2a1a02}
.btn.soft{background:var(--s3);border:1px solid var(--line2);color:var(--text)}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--text)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:12px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--s3);border:1px solid var(--line2);white-space:nowrap}
.pill.coral{background:rgba(255,106,77,.14);border-color:rgba(255,106,77,.45);color:#ffb3a2}
.pill.cyan{background:rgba(76,201,240,.12);border-color:rgba(76,201,240,.4);color:#9fe3f7}
.pill.gold{background:rgba(255,201,92,.13);border-color:rgba(255,201,92,.45);color:var(--gold)}
.pill.good{background:rgba(69,211,154,.12);border-color:rgba(69,211,154,.4);color:var(--good)}
.pill.bad{background:rgba(255,84,112,.12);border-color:rgba(255,84,112,.4);color:var(--bad)}
.bar{height:7px;background:#08070f;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#2aa7d1,var(--cyan));transition:width .5s}
.bar.c>i{background:linear-gradient(90deg,var(--coral-d),var(--coral))}.bar.g>i{background:linear-gradient(90deg,#24a674,var(--good))}.bar.y>i{background:linear-gradient(90deg,#c48a25,var(--gold))}.bar.r>i{background:linear-gradient(90deg,#b8324a,var(--bad))}.bar.v>i{background:linear-gradient(90deg,#7c5ce0,var(--violet))}
.rt{display:inline-grid;place-items:center;min-width:38px;padding:2px 6px;border-radius:8px;font-family:var(--num);font-weight:700;font-size:14px;color:#0c0b17}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line2);min-height:116px;background:#0d0b16;display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;padding:12px 14px;margin:12px 0}
.hero .tools{position:absolute;top:9px;left:10px;z-index:2;display:flex;gap:6px;align-items:center}
.hero .tools .cash{font-size:12.5px;padding:4px 8px;background:rgba(12,11,23,.6)}
.hero .tools .iconbtn{width:32px;height:32px;border-radius:9px;background:rgba(12,11,23,.6)}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to left,rgba(12,11,23,.94) 0%,rgba(12,11,23,.62) 42%,rgba(12,11,23,.12) 68%,rgba(12,11,23,.5) 100%)}
.hero .txt{position:relative;z-index:1;min-width:0}
.hero .eb{font-family:var(--cond);letter-spacing:.14em;font-size:12px;color:var(--gold);font-weight:600}
.hero .nm{font-family:var(--cond);font-weight:700;font-size:34px;line-height:.95;margin:3px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.hero .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--cond);font-size:14.5px;font-weight:500}
.hero .st{color:var(--gold);letter-spacing:1px;font-family:var(--f);font-size:12.5px}
.hero .role{border:1.5px solid var(--coral);color:var(--coral);letter-spacing:.1em;padding:1px 8px;border-radius:6px;font-size:12.5px;font-weight:600}
.hero .ovr{position:relative;z-index:1;background:rgba(12,11,23,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:4px 11px 6px;text-align:center}
.hero .ovr b{font-family:var(--cond);font-size:40px;line-height:1;color:var(--coral);display:block;font-weight:700}
.hero .ovr span{font-family:var(--cond);letter-spacing:.24em;font-size:10.5px;color:var(--mute)}
/* tryout */
.tryc{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#0b0a14}
.tryc canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.tryhud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.tryhud b{font-family:var(--cond);font-size:28px;line-height:1}
.tryhud span{font-family:var(--cond);font-size:12px;letter-spacing:.12em;color:var(--mute);display:block}
.trymsg{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--cond);font-size:20px;font-weight:600;letter-spacing:.06em;pointer-events:none;text-shadow:0 2px 10px #000}
.pips{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
.pips i{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-family:var(--cond);font-size:13px;color:var(--mute)}
.pips i.mk{background:var(--good);border-color:var(--good);color:#04130c}.pips i.ms{border-color:var(--bad);color:var(--bad)}.pips i.cur{border-color:var(--gold);color:var(--gold)}.pips i.money{border-style:dashed}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:-16px;padding:10px 16px;background:linear-gradient(var(--bg) 80%,rgba(12,11,23,0));display:flex;align-items:center;gap:11px}
.avw{position:relative;flex:none}
.ovb{position:absolute;bottom:-3px;inset-inline-start:-5px;background:var(--bg);border:2px solid var(--coral);color:#fff;font-family:var(--num);font-weight:700;font-size:13px;border-radius:9px;padding:0 5px;line-height:19px}
.hdr .nm{font-weight:900;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden}
.hdr .sub span{overflow:hidden;text-overflow:ellipsis}
.cash{font-family:var(--num);font-weight:700;font-size:14px;color:var(--gold);background:rgba(255,201,92,.08);border:1px solid rgba(255,201,92,.3);border-radius:11px;padding:6px 9px;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);display:grid;place-items:center;cursor:pointer;flex:none}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{pointer-events:auto;max-width:500px;margin:0 auto;display:flex;justify-content:space-between;gap:4px;background:rgba(20,19,39,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:22px;padding:7px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.dock button{flex:1;background:none;border:0;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border-radius:15px;color:var(--dim);font-weight:800;font-size:13.5px;cursor:pointer;transition:flex .25s,background .2s}
.dock button span{display:none}
.dock button[aria-current="true"]{flex:2.1;background:linear-gradient(180deg,#ff8466,var(--coral-d));color:#fff}
.dock button[aria-current="true"] span{display:inline}
/* next match */
.next{padding:18px 16px;background:radial-gradient(120% 90% at 50% -20%,color-mix(in srgb,var(--tc) 30%,transparent),transparent 62%),var(--s1)}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:16px 0 14px;text-align:center}
.matchup .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.matchup .side b{font-size:15px;line-height:1.15;text-wrap:balance}
.matchup .mid{min-width:88px;display:flex;flex-direction:column;align-items:center}
.matchup .mid b{font-family:var(--num);font-size:46px;line-height:1}
.form{display:flex;gap:4px}
.form span{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:900}
.form .w{background:rgba(69,211,154,.16);color:var(--good)}.form .l{background:rgba(255,84,112,.16);color:var(--bad)}
/* planner */
.days{display:grid;gap:5px;grid-template-columns:repeat(var(--dn,7),minmax(0,1fr))}
.day{min-width:0;border-radius:13px;background:var(--s2);border:1px solid var(--line2);padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.day .wd{font-size:11px;font-weight:700;color:var(--mute)}
.day .dn{font-family:var(--num);font-size:17px;line-height:1}
.day .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin-top:3px}
.day .tx{font-size:9.5px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.day .ic{width:26px!important;height:26px!important}
.day.train .ic{background:rgba(76,201,240,.16);color:var(--cyan)}.day.rest .ic{background:rgba(69,211,154,.16);color:var(--good)}.day.act .ic{background:rgba(167,139,250,.18);color:var(--violet)}.day.inv .ic{background:rgba(255,201,92,.16);color:var(--gold)}
.day.game{background:linear-gradient(180deg,rgba(255,106,77,.22),rgba(255,106,77,.06));border-color:rgba(255,106,77,.5)}
.day.game .ic{background:var(--coral);color:#fff}
.catseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 10px}
.catseg button{background:var(--s2);border:1px solid var(--line2);border-radius:11px;padding:7px 2px;font-weight:700;font-size:13px;cursor:pointer;color:var(--mute)}
.catseg button[aria-pressed="true"]{color:var(--text);border-color:var(--cyan);background:rgba(76,201,240,.1)}
.foc{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.foc button{background:var(--s2);border:1px solid var(--line2);border-radius:13px;padding:9px 10px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:5px}
.foc button b{font-size:13px;font-weight:700}
.foc button .row{gap:6px}
.foc button .bar{flex:1;height:5px}
.foc button[aria-pressed="true"]{border-color:var(--cyan);background:linear-gradient(180deg,rgba(76,201,240,.16),rgba(76,201,240,.04));box-shadow:0 0 0 1px var(--cyan) inset}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.mtr .row{justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}
.avg5{display:grid;grid-template-columns:repeat(5,1fr);text-align:center}
.avg5 b{display:block;font-family:var(--num);font-size:24px;line-height:1.1}
.avg5 span{font-size:11px;font-weight:700;color:var(--mute)}
.spark{display:flex;align-items:flex-end;gap:4px;height:44px}
.spark i{flex:1;border-radius:4px 4px 2px 2px;min-height:4px}
.seg{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.seg button{flex:none;border:1px solid var(--line2);background:var(--s2);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:transparent}
.news{display:flex;flex-direction:column;gap:9px;font-size:14px}
.news div{padding-inline-start:11px;border-inline-start:2px solid var(--line2)}
.news div.hot{border-color:var(--coral)}
/* profile */
.phero{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-size:32px;line-height:1;padding-bottom:10px}
.ring span{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--mute)}
.radar{display:block;margin:4px auto 0;max-width:100%;height:auto}
.top3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.top3>div+div{border-inline-start:1px solid var(--line2)}
.top3 b{display:block;font-family:var(--num);font-size:24px}
.top3 span{font-size:12px;color:var(--mute);font-weight:700}
.attrrow{display:grid;grid-template-columns:112px 1fr 30px 40px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.attrrow .d{font-size:12px;font-weight:700;text-align:left;font-family:var(--num)}
.archs{display:flex;gap:8px;flex-wrap:wrap}
.arch{border:1.5px dashed var(--line2);border-radius:13px;padding:8px 11px;font-size:13px;font-weight:700;color:var(--dim);background:none;text-align:right}
.arch.on{border-style:solid;border-color:rgba(255,201,92,.5);color:var(--text);cursor:pointer}
.arch.act{background:linear-gradient(180deg,#ffd885,#d9a23a);color:#2a1a02;border-color:transparent}
.arch small{display:block;font-weight:600;font-size:11px;opacity:.85}
/* cabinet */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.trophy{background:radial-gradient(100% 80% at 50% 0%,rgba(255,201,92,.18),transparent 70%),var(--s2);border:1px solid rgba(255,201,92,.3);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}
.trophy b{font-size:12.5px;line-height:1.2}
.trophy span{font-size:11px;color:var(--mute)}
.trophy.aw{background:radial-gradient(100% 80% at 50% 0%,rgba(76,201,240,.16),transparent 70%),var(--s2);border-color:rgba(76,201,240,.3)}
.highs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.highs div{background:var(--s2);border:1px solid var(--line2);border-radius:14px;padding:10px 12px}
.highs b{font-family:var(--num);font-size:24px;display:block}
.highs span{font-size:12px;color:var(--mute)}
/* social & money */
.fol b{font-family:var(--num);font-size:46px;line-height:1}
.post{background:var(--s1);border:1px solid var(--line);border-inline-start:3px solid var(--line2);border-radius:18px;padding:14px}
.post.fan{border-inline-start-color:var(--gold)}.post.news{border-inline-start-color:var(--cyan)}.post.club{border-inline-start-color:var(--good)}.post.mate{border-inline-start-color:var(--violet)}.post.rival{border-inline-start-color:var(--bad)}.post.me{border-inline-start-color:var(--coral)}
.post .who{display:flex;align-items:center;gap:10px}
.post .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;flex:none;border:2px solid var(--line2)}
.post .who b{display:block;font-size:14.5px}
.post .who small{font-size:12px;color:var(--mute);font-weight:700}
.post p{margin:10px 0;font-size:15px}
.post .eng{display:flex;gap:16px;color:var(--mute);font-weight:700;font-size:13px;border-top:1px solid var(--line);padding-top:9px}
.port b.big{font-family:var(--num);font-size:40px;line-height:1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid var(--line2);margin-top:14px;padding-top:12px}
.g3>div+div{border-inline-start:1px solid var(--line2)}
.g3 b{display:block;font-family:var(--num);font-size:17px}
.g3 span{font-size:11px;font-weight:700;color:var(--mute)}
.vent{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vc{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:right;padding:0;display:flex;flex-direction:column}
.vc .art{height:84px;position:relative;overflow:hidden}
.vc .art svg{position:absolute;inset:0;width:100%;height:100%}
.vc .tx{padding:10px 12px 12px}
.vc .tx b{display:block;font-size:15px;font-weight:800}
.vc .tx span{font-size:12px;color:var(--mute)}
.li{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:800;font-size:14.5px}.li .s{font-size:12.5px;color:var(--mute)}
.asset{cursor:pointer}
.risk{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-inline-start:6px}
